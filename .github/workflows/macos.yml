name: macos

on:
  push:
    branches: [mac]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: lint, types, tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Validate native IPC toolchain
        run: |
          set -euo pipefail
          swift --version
          sdk="$(xcrun --show-sdk-version)"
          echo "macOS SDK: ${sdk}"
          case "${sdk}" in
            26.*) ;;
            *) echo "macOS 26 SDK required for the real Swift IPC tests" >&2; exit 1 ;;
          esac

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format (changed files only)
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            echo "no base commit; skipping format gate"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- '*.py')"
          if [[ -z "${files}" ]]; then
            echo "no python files changed"
            exit 0
          fi
          echo "${files}"
          echo "${files}" | tr '\n' '\0' | xargs -0 uv run --frozen ruff format --check

      - name: mypy
        run: uv run --frozen python -m mypy

      - name: pytest
        run: uv run --frozen python -m pytest -q

  linux-parity:
    name: linux engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Tests must pass without any Apple engine
        run: uv run --frozen python -m pytest -q

      - name: Types must check on Linux too
        run: uv run --frozen python -m mypy

      - name: The GNOME paths must not have moved
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path

          os.environ["XDG_CONFIG_HOME"] = "/tmp/cfg"
          os.environ["XDG_DATA_HOME"] = "/tmp/data"
          from desktop_app.platform import paths

          assert paths.config_dir() == Path("/tmp/cfg/translator"), paths.config_dir()
          assert paths.data_dir() == Path("/tmp/data/translator"), paths.data_dir()
          assert not paths.is_macos()
          from translate_logic.infrastructure.providers import apple

          assert not apple.is_available(), "apple engines must stay off on Linux"
          print("linux paths and engine gating OK")
          PY

  sidecar:
    name: swift sidecar
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          sdk="$(xcrun --show-sdk-version)"
          echo "macOS SDK: ${sdk}"
          # TranslationSession(installedSource:target:) is macOS 26 only.
          if [[ "${sdk%%.*}" -lt 26 ]]; then
            echo "::error::macOS 26 SDK required, runner has ${sdk}"
            exit 1
          fi

      - name: Build apple-lang-helper
        working-directory: macos/AppleLangHelper
        run: swift build -c release

      - name: Run AppleLangHelperCore tests
        working-directory: macos/AppleLangHelper
        run: scripts/swift-test.sh

      - name: Smoke the sidecar protocol
        working-directory: macos/AppleLangHelper
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"id":"1","op":"ping"}' \
            '{"id":"2","op":"dictionaries"}' \
            '{"id":"3","op":"shutdown"}' \
            | ./.build/release/apple-lang-helper | tee /tmp/sidecar.jsonl
          uv run --frozen python - <<'PY'
          import json, pathlib, sys
          lines = [json.loads(l) for l in pathlib.Path("/tmp/sidecar.jsonl").read_text().splitlines() if l.strip()]
          assert [m["id"] for m in lines] == ["1", "2", "3"], lines
          assert all(m["ok"] for m in lines), lines
          assert lines[0]["result"]["pong"] is True
          print("sidecar protocol OK")
          PY

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: apple-lang-helper
          path: macos/AppleLangHelper/.build/release/apple-lang-helper
          if-no-files-found: error

  shell:
    name: swiftui shell
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Translator
        working-directory: macos/Translator
        run: swift build -c release

      - name: Run TranslatorCore tests
        working-directory: macos/Translator
        run: scripts/swift-test.sh

      - name: The shell must speak the Python protocol
        run: |
          set -euo pipefail
          # Method and event names are duplicated in Swift; drift breaks the app
          # silently, so compare both lists.
          uv run --frozen python - <<'PY'
          import pathlib, re

          py = pathlib.Path("desktop_app/platform/macos/ipc/protocol.py").read_text()
          swift = pathlib.Path("macos/Translator/Sources/TranslatorCore/Protocol.swift").read_text()

          def literals(block: str, source: str) -> set[str]:
              body = re.search(rf"class {block}\(StrEnum\):(.*?)\n\n\n", source, re.S)
              assert body, block
              return set(re.findall(r'= "([^"]+)"', body.group(1)))

          methods = literals("Method", py)
          events = literals("Event", py)
          missing = sorted(n for n in methods | events if f'"{n}"' not in swift)
          assert not missing, f"swift shell is missing: {missing}"
          print(f"protocol parity OK: {len(methods)} methods, {len(events)} events")
          PY

  bundle:
    name: app bundle
    needs: [gate, sidecar, shell, linux-parity]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CPython 3.13 for the bundle
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Build Translator.app
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "${version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo 'invalid release version'; exit 1; }
            # RC tags are explicit ad-hoc prereleases. The native version is numeric.
            export TRANSLATOR_APP_VERSION="${BASH_REMATCH[1]}"
          fi
          scripts/build_macos_app.sh --out dist

      - name: Verify bundle contract
        run: |
          set -euo pipefail
          app="dist/Translator.app"
          test -x "${app}/Contents/MacOS/Translator"
          # A real SwiftUI binary, not the placeholder launcher.
          file "${app}/Contents/MacOS/Translator" | grep -q "Mach-O"
          test -x "${app}/Contents/Resources/bin/run-backend"
          test -x "${app}/Contents/Resources/bin/apple-lang-helper"
          test -x "${app}/Contents/Resources/python/bin/python3.13"
          test -d "${app}/Contents/Resources/app/desktop_app"
          test -d "${app}/Contents/Resources/app/translate_logic"
          # Offline bases are downloaded at first run; they must never ship.
          if find "${app}" -name '*.sqlite3' | grep -q .; then
            echo "offline databases leaked into the bundle"; exit 1
          fi
          codesign -v --deep --strict "${app}"
          du -sh "${app}"

      - name: Backend smoke from inside the bundle
        run: |
          set -euo pipefail
          # Both actual embedded launchers must ignore unrelated cwd packages.
          # The shared checker owns each profile/socket/PID and verifies the seal.
          uv run --frozen python scripts/check_macos_bundle_runtime.py \
            --app dist/Translator.app --report "${RUNNER_TEMP}/bundle-runtime.json"

      - name: The toolchain must not write into a signed bundle
        run: |
          set -euo pipefail
          # This regressed once: a shipped test helper got imported, a .pyc
          # landed inside Resources/ and the code seal broke. The gate job
          # runs the suite with no bundle present, so only here can it be
          # caught. Run everything that touches the tree, then re-verify.
          uv run --frozen python -m pytest -q
          uv run --frozen ruff check .
          uv run --frozen python -m mypy
          codesign --verify --deep --strict dist/Translator.app
          if find dist/Translator.app -name '*.pyc' -newer dist/Translator.app/Contents/Info.plist | grep -q .; then
            echo "bytecode was written into the bundle after signing"; exit 1
          fi

      - name: Package bundle
        run: |
          set -euo pipefail
          mkdir -p out
          # Internal transport to the notarization job, not an installer.
          ditto -c -k --sequesterRsrc --keepParent dist/Translator.app out/Translator-macos.zip
          scripts/package_macos_dmg.sh dist/Translator.app out

      - name: Verify DMG release contract
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import plistlib
          from dev.scripts.release_metadata import macos_code_asset_files, sha256_file

          info = plistlib.loads(Path("dist/Translator.app/Contents/Info.plist").read_bytes())
          expected = macos_code_asset_files(f"v{info['CFBundleShortVersionString']}")
          output = Path("out")
          allowed = {"Translator-macos.zip"}
          for name in expected:
              allowed.update((name, f"{name}.sha256"))
              image = output / name
              checksum = output / f"{name}.sha256"
              assert checksum.read_text() == f"{sha256_file(image)}  {name}\n"
          assert {path.name for path in output.iterdir()} == allowed
          print("DMG release contract and checksums verified; no script installer")
          PY

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Translator-macos
          path: |
            out/Translator-macos.zip
            out/Translator-*-macos-arm64.dmg
            out/Translator-*-macos-arm64.dmg.sha256
          if-no-files-found: error

  notarize:
    name: notarize
    needs: [bundle]
    # Stable tags still require Developer ID and notarization. RCs are ad-hoc.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: Translator-macos
          path: out

      - name: Check notarization secrets
        id: secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_PASSWORD}" && -n "${APPLE_SIGNING_IDENTITY}" && -n "${CERT_BASE64}" && -n "${CERT_PASSWORD}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::error::Public release BLOCKED: Developer ID certificate and notarization credentials are required."
            exit 1
          fi

      - name: Import signing certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/build.keychain-db"
          security create-keychain -p actions "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p actions "${keychain}"
          umask 077
          printf '%s' "${CERT_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          swift scripts/import_macos_certificate.swift "${RUNNER_TEMP}/cert.p12" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "${keychain}"
          rm -f "${RUNNER_TEMP}/cert.p12"

      - name: Sign, notarize and staple
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ditto -x -k out/Translator-macos.zip unpacked
          app="unpacked/Translator.app"
          # One signing host covers every Mach-O, including TranslatorBackend,
          # with --options runtime and timestamp for the Developer ID identity.
          scripts/sign_macos_app.sh "${app}" "${APPLE_SIGNING_IDENTITY}"
          keychain="${RUNNER_TEMP}/build.keychain-db"
          uv run --frozen python scripts/store_notary_credentials.py translator-ci "${keychain}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" notarize.zip
          xcrun notarytool submit notarize.zip --keychain-profile translator-ci --keychain "${keychain}" --wait --output-format json > app-notary.json
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("app-notary.json").read_text())["status"] == "Accepted", "App notarization was not Accepted"
          PY
          xcrun stapler staple "${app}"
          xcrun stapler validate "${app}"
          codesign --verify --deep --strict "${app}"
          spctl -a -vvv "${app}"
          mkdir -p signed
          scripts/package_macos_dmg.sh "${app}" signed
          dmg="$(find signed -maxdepth 1 -name '*.dmg' -print)"
          test -n "${dmg}"
          codesign --force --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${dmg}"
          xcrun notarytool submit "${dmg}" --keychain-profile translator-ci --keychain "${keychain}" --wait --output-format json > dmg-notary.json
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("dmg-notary.json").read_text())["status"] == "Accepted", "DMG notarization was not Accepted"
          PY
          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
          # Signing/stapling changes bytes: regenerate the distributed checksum last.
          (cd signed && shasum -a 256 "$(basename "${dmg}")" > "$(basename "${dmg}").sha256" && shasum -a 256 -c "$(basename "${dmg}").sha256")

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cert.p12"
          if [[ -f "${RUNNER_TEMP}/build.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/build.keychain-db"
          fi

      - name: Upload notarized bundle
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Translator-macos-notarized
          path: |
            signed/Translator-*-macos-arm64.dmg
            signed/Translator-*-macos-arm64.dmg.sha256
          if-no-files-found: error
